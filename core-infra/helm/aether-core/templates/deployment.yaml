apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether-core
  namespace: {{ include "aether-core.namespace" . }}
  labels:
    {{- include "aether-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: cognitive-engine
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aether-core
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aether-core
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        app.kubernetes.io/part-of: aether-core
        app.kubernetes.io/component: cognitive-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
        # Force pod restart when the ConfigMap changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "aether-core.app.serviceAccountName" . }}
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        {{- if not .Values.openshift.enabled }}
        runAsUser: 1000
        fsGroup: 1000
        {{- end }}

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aether-core
              app.kubernetes.io/instance: {{ .Release.Name }}

      containers:
        - name: aether-core
          image: {{ include "aether-core.app.image" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP

          securityContext:
            runAsNonRoot: true
            {{- if not .Values.openshift.enabled }}
            runAsUser: 1000
            {{- end }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}

          env:
            # ── Secrets (External Secrets Operator / pre-created Secret) ──────
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.existingSecret }}
                  key: postgres-url
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.existingSecret }}
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.existingSecret }}
                  key: postgres-password
            # Optional — only present when data-subject verification is required.
            - name: DATA_SUBJECT_VERIFICATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.existingSecret }}
                  key: data-subject-verification-secret
                  optional: true
            # ── ConfigMap ─────────────────────────────────────────────────────
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: aether-core-config
                  key: kafka-bootstrap-servers
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: aether-core-config
                  key: ollama-base-url
            - name: DATA_SUBJECT_REQUIRE_VERIFICATION
              valueFrom:
                configMapKeyRef:
                  name: aether-core-config
                  key: data-subject-require-verification
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: aether-core-config
                  key: spring-profiles-active

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
