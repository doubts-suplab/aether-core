{{- if .Values.app.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aether-core.app.serviceAccountName" . }}
  namespace: {{ include "aether-core.namespace" . }}
  labels:
    {{- include "aether-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: cognitive-engine
  {{- with .Values.app.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
