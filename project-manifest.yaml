# EEIK Project Manifest — Aether Core
# Canonical manifest (schema_version 1.0) validated against eeik/schemas/manifest.schema.json
# (schema + governance rules pass — `python -m eeik validate project-manifest.yaml`).
# Adopted under eeik governance at the manifest level (see .claude/memory/decisions.md, ADR-014).
# Engine-driven activation/lock/verify for external repos is a follow-up: eeik's activate/lock/doctor
# are currently bound to the eeik-bootstrap repo root.

schema_version: "1.0"

project:
  name: aether-core
  description: >
    Personal cognitive engine of the Aether ecosystem — individual memory, reasoning
    sessions, and emotional context, served to the agent mesh as personal context.
  owner: suplab
  domain: generic
  project_type: agent-platform

technology:
  backend:
    language: java
    version: 21
    framework: spring-boot
  database:
    type: postgresql
    migration_tool: flyway
    orm: jdbctemplate
  containerisation:
    runtime: docker

architecture:
  style: modular-monolith
  patterns:
    - ddd
  api_style: rest

cloud:
  provider: local-first
  infra_as_code: none
  multi_account: false
  finops: false

ai:
  enabled: true
  pattern: rag
  framework: none
  foundation_model: ollama
  governance_required: true
  memory_pattern: vector-store

governance:
  profile: enterprise
  reviews_required:
    - architecture-review
    - security-review
  compliance_frameworks:
    - gdpr
  adr_required: true
  coverage_threshold: 80

delivery:
  model: single-team
  methodology: incremental
  sprint_length_weeks: 2
  cicd_platform: github-actions
